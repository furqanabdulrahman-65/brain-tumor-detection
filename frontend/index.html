<head>

    <!-- Fonts -->

        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"

<body>

    <div class="app-container">
        <!-- Sidebar Container (Rendered via JS) -->
        <aside class="sidebar" id="sidebar-container">
            <!-- Content will be injected by renderSidebar() -->
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="main-view">
            <!-- Dynamic Content -->
        </main>
    </div>

    <script>
        // Dynamic API URL logic
        // If we are on localhost, hardcode the port (likely development)
        // If we are on ngrok/production (HTTPS), use the origin relative path
        if (!window.API_URL) {
            const host = window.location.hostname;
            if (host === 'localhost' || host === '127.0.0.1') {
                window.API_URL = 'http://127.0.0.1:8004';
            } else {
                // For ngrok, we want the current origin (e.g. https://xyz.ngrok.io)
                // The backend is served from the same origin but via /api route usually?
                // OR if backend is separate, we might need configuration. 
                // But assuming the user is tunneling the backend port directly:
                // If they tunnel port 8004, then the origin IS the backend.
                window.API_URL = window.location.origin;
            }
        }

        const STATE = { reportsMap: {} };
        let currentLang = localStorage.getItem('lang') || 'en';
        let currentView = 'dashboard';

        // --- Translation Helper ---
        function t(key, params = {}) {
            if (!TRANSLATIONS[currentLang]) return key;
            let str = TRANSLATIONS[currentLang][key] || key;
            Object.keys(params).forEach(k => {
                str = str.replace(`{${k}}`, params[k]);
            });
            return str;
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            renderSidebar();
            navigate(currentView); // Re-render current view with new language
        }

        // --- Sidebar ---
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-container');
            sidebar.innerHTML = `

                        <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-5.04z" />
                        <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-5.04z" />

                        <path d="M12 12v6" opacity="0.5" />

                    <span class="logo-text">${t('app_name')}</span>
                </div>

                <nav class="nav-links">
                    <a href="#" class="nav-link ${currentView === 'dashboard' ? 'active' : ''}" onclick="navigate('dashboard', event)">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        ${t('dashboard')}
                    </a>
                    <a href="#" class="nav-link ${currentView === 'scan' ? 'active' : ''}" onclick="navigate('scan', event)">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        ${t('new_analysis')}
                    </a>
                    <a href="#" class="nav-link ${currentView === 'history' ? 'active' : ''}" onclick="navigate('history', event)">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        ${t('history')}
                    </a>
                    </a>
                    <a href="#" class="nav-link ${currentView === 'teleradiology' ? 'active' : ''}" onclick="navigate('teleradiology', event)">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 10l5 5-5 5"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/></svg>
                        ${t('tele_radiology') || 'Tele-Radiology'}

                        ${t('federated_node') || 'Federated Node'}
                    </a>
                    <a href="#" class="nav-link ${currentView === 'about' ? 'active' : ''}" onclick="navigate('about', event)">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>

                </nav>

                    <select onchange="setLanguage(this.value)" class="lang-select">
                        <option value="en" ${currentLang === 'en' ? 'selected' : ''}>English</option>

                        <option value="fr" ${currentLang === 'fr' ? 'selected' : ''}>Français (French)</option>
                        <option value="de" ${currentLang === 'de' ? 'selected' : ''}>Deutsch (German)</option>
                        <option value="hi" ${currentLang === 'hi' ? 'selected' : ''}>हिंदी (Hindi)</option>
                        <option value="te" ${currentLang === 'te' ? 'selected' : ''}>తెలుగు (Telugu)</option>
                        <option value="zh" ${currentLang === 'zh' ? 'selected' : ''}>中文 (Chinese)</option>
                    </select>
                </div>
            `;
        }


        // --- Navigation ---
        function navigate(viewName, event) {
            if (event) event.preventDefault();
            currentView = viewName;

            // Re-render sidebar to update active state
            renderSidebar();

            if (viewName === 'dashboard') {
                renderDashboard();
            } else if (viewName === 'scan') {
                renderScanForm();
            } else if (viewName === 'history') {
                renderHistory();
            } else if (viewName === 'about') {
                renderAbout();
            } else if (viewName === 'teleradiology') {
                renderTeleRadiology();
            } else if (viewName === 'federated') {
                renderFederatedNode();
            }
        }

        async function init() {
            renderSidebar();
            navigate(currentView);
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
        }

        // --- Views ---

        async function renderHistory() {
            const main = document.getElementById('main-view');
            main.innerHTML = `<div style="text-align:center; padding: 2rem;">${t('loading_history')}</div>`;

            let reports = [];
            try {
                const res = await fetch(`${API_URL}/api/reports`);
                if (res.ok) reports = await res.json();
                reports.sort((a, b) => b.id - a.id);
                reports.forEach(r => STATE.reportsMap[r.id] = r);
            } catch (e) { console.error(e); }

            // ANALYTICS CALCULATIONS
            const now = new Date();
            const oneWeekAgo = new Date();
            oneWeekAgo.setDate(now.getDate() - 7);

            const weeklyScans = reports.filter(r => new Date(r.created_at) >= oneWeekAgo).length;

            const totalReports = reports.length;
            const tumorCount = reports.filter(r => r.prediction_label === 'Tumor Detected').length;
            const detectionRate = totalReports > 0 ? ((tumorCount / totalReports) * 100).toFixed(1) : 0;

            // PREPARE DATA FOR LINE CHART (Timeline)
            // 1. Generate last 7 days to ensure graph always looks like a timeline
            const dateMap = {};
            const labels = [];

            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = d.toLocaleDateString('en-CA'); // YYYY-MM-DD
                labels.push(dateStr);
                dateMap[dateStr] = { tumor: 0, noTumor: 0 };
            }

            // 2. Fill with actual data
            reports.forEach(r => {
                const date = new Date(r.created_at).toLocaleDateString('en-CA');
                if (dateMap[date]) {
                    if (r.prediction_label === 'Tumor Detected') dateMap[date].tumor++;
                    else dateMap[date].noTumor++;
                }
            });

            const tumorData = labels.map(d => dateMap[d].tumor);
            const noTumorData = labels.map(d => dateMap[d].noTumor);

            main.innerHTML = `
                <div style="margin-bottom: 2rem;">
                    <h1>${t('analysis_history')}</h1>
                    <p style="color: var(--text-muted);">${t('visual_overview')}</p>
                </div>

                <!-- Analytics Cards -->
                <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 2.5rem;">
                    <div class="card stat-item">
                        <div style="font-size: 2rem; font-weight: 700; color: var(--primary);">${weeklyScans}</div>
                        <div style="color: var(--text-muted);">${t('scans_this_week')}</div>
                    </div>
                    <div class="card stat-item">
                        <div style="font-size: 2rem; font-weight: 700; color: var(--text-main);">${detectionRate}%</div>
                        <div style="color: var(--text-muted);">${t('tumor_detection_rate')}</div>
                    </div>
                </div>

                <div class="card" style="margin: 0 auto;">
                    <h3 style="margin-bottom: 1.5rem; text-align:center;">${t('diagnosis_trends')}</h3>
                    <div style="position: relative; height: 350px;">
                        <canvas id="historyChart"></canvas>
                    </div>
                </div>
            `;

            // Initialize Line Chart
            setTimeout(() => {
                const ctx = document.getElementById('historyChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels, // Last 7 days
                        datasets: [
                            {
                                label: t('tumor_detected'),
                                data: tumorData,
                                borderColor: 'rgba(239, 68, 68, 1)', // Red
                                backgroundColor: 'rgba(239, 68, 68, 0.2)',
                                tension: 0.4,
                                fill: true
                            },
                            {
                                label: t('no_tumor'),
                                data: noTumorData,
                                borderColor: 'rgba(16, 185, 129, 1)', // Green
                                backgroundColor: 'rgba(16, 185, 129, 0.2)',
                                tension: 0.4,
                                fill: true
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { stepSize: 1, color: '#9ca3af' },
                                grid: { color: 'rgba(255, 255, 255, 0.1)' }
                            },
                            x: {
                                ticks: { color: '#9ca3af' },
                                grid: { color: 'rgba(255, 255, 255, 0.1)' }
                            }
                        },
                        plugins: {
                            legend: {
                                position: 'top',
                                labels: { color: '#9ca3af' }
                            }
                        }
                    }
                });
            }, 100);
        }

        // --- Tele-Radiology Helper Functions ---
        window.startTeleSession = function () {
            const btn = document.getElementById('connect-btn');
            const status = document.getElementById('standby-status');
            const stats = document.getElementById('conn-stats');
            const indicator = document.getElementById('live-indicator');
            const waveform = document.getElementById('waveform-canvas');

            // 1. Loading State
            btn.innerHTML = `<svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Connecting...`;
            btn.disabled = true;

            setTimeout(() => {
                // 2. Connected State (AI Voice Mode)
                btn.innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    AI Voice Active
                `;
                btn.className = 'btn'; // Reset classes
                btn.style.background = '#8b5cf6'; // Violet-500
                btn.style.borderColor = '#8b5cf6';
                btn.style.color = 'white';
                btn.style.boxShadow = '0 0 15px rgba(139, 92, 246, 0.4)';

                // Initialize Speech Synthesis
                const synth = window.speechSynthesis;
                let selectedVoice = null;

                const initVoice = () => {
                    const voices = synth.getVoices();
                    // Prefer Male Voice (Google UK Male or similar)
                    selectedVoice = voices.find(v => v.name.includes('Male') || v.name.includes('UK English Male')) ||
                        voices.find(v => v.name.includes('Google US English')) ||
                        voices[0];
                };

                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = initVoice;
                }
                initVoice();

                const speak = (text) => {
                    if (synth.speaking) {
                        console.error('speechSynthesis.speaking');
                        return;
                    }
                    const utterThis = new SpeechSynthesisUtterance(text);
                    if (selectedVoice) utterThis.voice = selectedVoice;

                    utterThis.onend = function (event) {
                        document.getElementById('ai-talking-indicator').style.opacity = '0';
                    }
                    utterThis.onstart = function (event) {
                        document.getElementById('ai-talking-indicator').style.opacity = '1';
                    }
                    utterThis.pitch = 0.9; // Slightly lower pitch for male voice
                    utterThis.rate = 1;
                    synth.speak(utterThis);
                };

                // Unified AI Processing Logic
                const processUserMessage = (text) => {
                    const chat = document.getElementById('tele-chat-msgs');
                    if (chat) {
                        chat.innerHTML += `
                            <div style="background: var(--primary); color: white; padding: 0.5rem 0.75rem; border-radius: 8px 8px 0 8px; align-self: flex-end; max-width: 85%;">
                                ${text}
                            </div>
                        `;
                        chat.scrollTop = chat.scrollHeight;
                    }

                    // AI Logic (Furqan Persona)
                    let response = "I am processing your query. Could you please provide more details?";
                    const lower = text.toLowerCase();

                    if (lower.includes('hello') || lower.includes('hi')) {
                        response = "Hello. I am Dr. Furqan, your AI medical consultant. I have reviewed the MRI scan. How may I assist you?";
                    } else if (lower.includes('tumor') || lower.includes('cancer')) {
                        response = "The imaging suggests a mass in the temporal region. A biopsy is recommended to confirm the pathology, but it appears localized.";
                    } else if (lower.includes('size') || lower.includes('big')) {
                        response = "The lesion is measuring approximately 2.4 centimeters in axial diameter.";
                    } else if (lower.includes('thank')) {
                        response = "You are welcome. Please let me know if you require further clarification.";
                    } else {
                        // Generic Response for other queries
                        response = "I understand. Based on the EfficientNet analysis, the structural integrity seems compromised in that region. I recommend further clinical correlation.";
                    }

                    // AI Response Bubble
                    setTimeout(() => {
                        if (chat) {
                            chat.innerHTML += `
                                 <div style="background: rgba(255,255,255,0.05); padding: 0.75rem 1rem; border-radius: 0 12px 12px 12px; align-self: flex-start; max-width: 85%; border: 1px solid rgba(255,255,255,0.1);">
                                     <div style="font-weight: 600; font-size: 0.75rem; color: #38bdf8; margin-bottom: 4px;">Dr. Furqan (AI)</div>
                                     ${response}
                                 </div>
                             `;
                            chat.scrollTop = chat.scrollHeight;
                        }
                        speak(response);
                    }, 500);
                }

                // Initialize Speech Recognition
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                let recognition;

                if (SpeechRecognition) {
                    recognition = new SpeechRecognition();
                    recognition.continuous = false;
                    recognition.lang = 'en-US';
                    recognition.interimResults = false;
                    recognition.maxAlternatives = 1;

                    recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        console.log('User said:', transcript);
                        processUserMessage(transcript);
                    };

                    recognition.onerror = (event) => {
                        console.error("Speech Recognition Error:", event.error);
                        const statusText = document.getElementById('mic-status-text');
                        if (statusText) {
                            let msg = event.error;
                            if (msg === 'not-allowed') msg = "Mic Blocked";
                            if (msg === 'no-speech') msg = "No Speech";
                            statusText.innerText = msg;
                            statusText.style.color = "#f87171";
                        }
                    };

                    recognition.onnomatch = () => {
                        const statusText = document.getElementById('mic-status-text');
                        if (statusText) statusText.innerText = "No Match";
                    };

                    recognition.onend = () => {
                        const statusText = document.getElementById('mic-status-text');
                        if (statusText && !statusText.innerText.includes("Blocked")) {
                            statusText.innerText = "Tap to Speak";
                            statusText.style.color = "#94a3b8";
                        }
                    };

                    recognition.onstart = () => {
                        const statusText = document.getElementById('mic-status-text');
                        if (statusText) {
                            statusText.innerText = "Listening...";
                            statusText.style.color = "#38bdf8";
                        }
                    }

        window.drawFakeWaveform = function () {
            const canvas = document.getElementById('waveform-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const parent = canvas.parentElement;
            canvas.width = parent.offsetWidth;
            canvas.height = 80;

            let offset = 0;
            function animate() {
                if (!document.getElementById('waveform-canvas')) return; // Stop if page changed
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
                const centerY = canvas.height / 2;
                ctx.moveTo(0, centerY);

                // Retrieve audio data if real, else simulate
                // To make it look like "Voice", we check if AI is speaking (by checking indicator opacity)
                const isTalking = document.getElementById('ai-talking-indicator')?.style.opacity === '1';
                const amplitude = isTalking ? 35 : 5;

                for (let i = 0; i < canvas.width; i++) {
                    const wave = Math.sin((i + offset) * 0.05) * Math.sin((i + offset) * 0.01) * amplitude;
                    ctx.lineTo(i, centerY + wave);
                }
                ctx.strokeStyle = isTalking ? 'rgba(167, 139, 250, 0.8)' : 'rgba(56, 189, 248, 0.3)';
                ctx.shadowBlur = isTalking ? 8 : 2;
                ctx.shadowColor = isTalking ? 'rgba(167, 139, 250, 0.6)' : 'rgba(56, 189, 248, 0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.shadowBlur = 0;

                offset += 4;
                requestAnimationFrame(animate);
            }
            animate();
        }

        window.updateFedLog = function (msg, type = "normal") {
            const consoleEl = document.getElementById('fed-console');
            if (!consoleEl) return;

            const line = document.createElement('div');
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });

            let color = "#cbd5e1";
            if (type === "success") color = "#4ade80";
            if (type === "warn") color = "#fbbf24";
            if (type === "error") color = "#f87171";
            if (type === "info") color = "#60a5fa";

            line.innerHTML = `<span style="color:#64748b; margin-right:8px;">[${time}]</span> <span style="color:${color}">${msg}</span>`;
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;

            // Limit lines
            if (consoleEl.children.length > 50) consoleEl.removeChild(consoleEl.firstChild);
        }

        window.initFederatedSwarm = function () {
            const canvas = document.getElementById('swarm-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const parent = canvas.parentElement;
            canvas.width = parent.offsetWidth;
            canvas.height = parent.offsetHeight;

            // Nodes
            const nodes = [];
            for (let i = 0; i < 30; i++) {
                nodes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 2 + 1,
                    connected: false
                });
            }

            // Central Server
            const center = { x: canvas.width / 2, y: canvas.height / 2 };

            let tokenBalance = 0.000;

            function animate() {
                if (!document.getElementById('swarm-canvas')) return;
                ctx.fillStyle = '#020617';
                ctx.fillRect(0, 0, canvas.width, canvas.height); // clear

                if (fedIsRunning) {
                    // Draw Central Hub
                    ctx.beginPath();
                    ctx.arc(center.x, center.y, 8, 0, Math.PI * 2);
                    ctx.fillStyle = '#60a5fa';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#60a5fa';
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Update and Draw Nodes
                    nodes.forEach(node => {
                        node.x += node.vx;
                        node.y += node.vy;

                        // Bounce
                        if (node.x < 0 || node.x > canvas.width) node.vx *= -1;
                        if (node.y < 0 || node.y > canvas.height) node.vy *= -1;

                        // Draw Node
                        ctx.beginPath();
                        ctx.arc(node.x, node.y, node.size, 0, Math.PI * 2);
                        ctx.fillStyle = '#34d399';
                        ctx.fill();

                        // Connect to center if close
                        const dist = Math.hypot(node.x - center.x, node.y - center.y);
                        if (dist < 150) {
                            ctx.beginPath();
                            ctx.moveTo(node.x, node.y);
                            ctx.lineTo(center.x, center.y);
                            ctx.strokeStyle = `rgba(52, 211, 153, ${1 - dist / 150})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();

                            // Send "Packet" animation occasionally
                            if (Math.random() < 0.02) {
                                drawPacket(ctx, node.x, node.y, center.x, center.y);
                            }
                        }
                    });
                } else {
                    ctx.fillStyle = "#94a3b8";
                    ctx.font = "14px Inter";
                    ctx.fillText("Node Offline", canvas.width / 2 - 40, canvas.height / 2);
                }

                requestAnimationFrame(animate);
            }
            animate();

            // Simulation Loop for Logs & Stats
            setInterval(() => {
                if (!fedIsRunning) return;

                const eventType = Math.random();
                if (eventType < 0.1) {
                    const loss = (Math.random() * 0.1 + 0.3).toFixed(4);
                    document.getElementById('local-loss').innerText = loss;
                    updateFedLog(`Epoch completed. Loss: ${loss}`, 'normal');
                } else if (eventType < 0.05) {
                    updateFedLog("Uploading local gradients to aggregator...", "info");
                } else if (eventType < 0.03) {
                    const acc = (94 + Math.random()).toFixed(1);
                    document.getElementById('global-acc').innerText = acc + "%";
                    updateFedLog(`Global model updated. New Accuracy: ${acc}%`, "success");

                    // Earn tokens
                    tokenBalance += 0.012;
                    document.getElementById('token-balance').innerText = tokenBalance.toFixed(3);
                } else if (eventType < 0.01) {
                    updateFedLog("Validating ZK-Proof identity...", "normal");
                }

                // Update Peer Count
                document.getElementById('peer-count').innerText = Math.floor(Math.random() * 50 + 100);

            }, 2000);
        }

        function drawPacket(ctx, x1, y1, x2, y2) {
            // Simple packet drawing (just a flash on the line really, handling animation frames for a specific packet is complex in this simple loop, 
            // so we just draw a brighter line or a dot)
            ctx.beginPath();
            ctx.arc((x1 + x2) / 2, (y1 + y2) / 2, 2, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        }

        function drawMechanicalGauge(canvasId, value, color) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const cx = width / 2;
            const cy = height / 2;
            const radius = Math.min(width, height) * 0.4;

            ctx.clearRect(0, 0, width, height);

            // 1. Outer Glow Ring (Static)
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 1.08, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 2. Track (Background Ring)
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0.75 * Math.PI, 2.25 * Math.PI);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 20;
            ctx.lineCap = 'round';
            ctx.stroke();

            // 3. Ticks (Neon Style)
            for (let i = 0; i <= 40; i++) {
                const angle = 0.75 * Math.PI + (i / 40) * (1.5 * Math.PI); const isMajor = i % 5 === 0;
                const len = isMajor ? 12 : 6; const rIn = radius - 30; const rOut = rIn + len; const x1 = cx + Math.cos(angle) * rIn;
                const y1 = cy + Math.sin(angle) * rIn; const x2 = cx + Math.cos(angle) * rOut; const y2 = cy + Math.sin(angle) * rOut;
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = isMajor ? 'rgba(255,255,255,0.3)'
                    : 'rgba(255,255,255,0.1)'; ctx.lineWidth = isMajor ? 2 : 1; ctx.stroke();
            } // 4. Progress Arc (Gradient + Glow)
            const startAngle = 0.75 * Math.PI; const maxAngle = 2.25 * Math.PI; const valNorm = Math.min(Math.max(value, 0), 100)
                / 100; const endAngle = startAngle + (valNorm * (maxAngle - startAngle)); // Create Gradient const
            grad = ctx.createLinearGradient(0, height, width, 0); if (color.includes('#ef4444')) { // Tumor: Violet -> Red ->
                Orange
                grad.addColorStop(0, '#8b5cf6');
                grad.addColorStop(0.5, '#ef4444');
                grad.addColorStop(1, '#f97316');
            } else {
                // Healthy: Cyan -> Emerald
                grad.addColorStop(0, '#06b6d4');
                grad.addColorStop(1, '#10b981');
            }

            // Draw Glow
            ctx.shadowBlur = 25;
            ctx.shadowColor = color;

            ctx.beginPath();
            ctx.arc(cx, cy, radius, startAngle, endAngle);
            ctx.strokeStyle = grad;
            ctx.lineWidth = 20;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Reset Shadow
            ctx.shadowBlur = 0;

            // 5. Indicator Nub
            if (value > 0) {
                const nubX = cx + Math.cos(endAngle) * radius;
                const nubY = cy + Math.sin(endAngle) * radius;
                ctx.beginPath();
                ctx.arc(nubX, nubY, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#fff';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function updateDiagnosis(id) {
            const panel = document.getElementById(`classification-panel-${id}`);
            const resultBox = document.getElementById(`suggestion-result-${id}`);

            let scores = { 'Glioblastoma': 0, 'Meningioma': 0, 'Pituitary Tumor': 0 };

            // Weighted Rules
            if (panel.querySelector('[data-symptom="necrosis"]').checked) scores['Glioblastoma'] += 4;
            if (panel.querySelector('[data-symptom="edema"]').checked) {
                scores['Glioblastoma'] += 2; scores['Meningioma']
                    += 1;
            }
            if (panel.querySelector('[data-symptom="ring"]').checked) scores['Glioblastoma'] += 3;
            if (panel.querySelector('[data-symptom="tail"]').checked) scores['Meningioma'] += 5;
            if (panel.querySelector('[data-symptom="circumscribed"]').checked) {
                scores['Meningioma'] += 3;
                scores['Pituitary Tumor'] += 3;
            }

            // Find Max
            let maxScore = 0;
            let likelyType = "Uncertain";

            for (const [type, score] of Object.entries(scores)) {
                if (score > maxScore) {
                    maxScore = score;
                    likelyType = type;
                }
            }

            if (maxScore === 0) {
                resultBox.innerText = "Check features above...";
                return;
            }

            // Calculate vague "confidence" based on max possible score approx
            let conf = Math.min(Math.round((maxScore / 7) * 100), 99);

            resultBox.innerHTML = `Likely <span>${likelyType}</span> (${conf}%)`;
        }

        let recognition;

        function toggleDictation(fieldId) {
            console.log("Toggle dictation clicked for:", fieldId);

            // Check for Secure Context (HTTPS or Localhost)
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' &&
                window.location.hostname !== '127.0.0.1') {
                alert("Voice dictation requires HTTPS or Localhost.");
                return;
            }

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Your browser does not support voice dictation. Please use Chrome or Edge.");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            // If already recording, stop it.
            if (isRecording) {
                if (recognition) recognition.stop();
                return;
            }

            // Start new recording
            try {
                recognition = new SpeechRecognition();
                recognition.lang = currentLang === 'hi' ? 'hi-IN' : currentLang === 'te' ? 'te-IN' : 'en-US';
                recognition.continuous = false; // Simple mode usually works best
                recognition.interimResults = true; // Show results as we speak

                recognition.onstart = function () {
                    console.log("Dictation started");
                    isRecording = true;
                    currentFieldId = fieldId;
                    const btn = document.getElementById(`mic-${fieldId}`);
                    if (btn) btn.classList.add('mic-active');
                };

                recognition.onresult = function (event) {
                    const transcript = Array.from(event.results)
                        .map(result => result[0].transcript)
                        .join('');

                    const field = document.getElementById(fieldId);
                    if (field) {
                        // Only append if it's the final result to avoid duplication and cursor jumping
                        if (event.results[0].isFinal) {
                            const existing = field.value ? field.value : "";
                            const prefix = (existing && !existing.endsWith(' ')) ? " " : "";
                            field.value = existing + prefix + transcript;
                        }
                    }
                };

                recognition.onerror = function (event) {
                    console.error("Speech error", event);
                    if (event.error === 'not-allowed') {
                        alert("Microphone permission denied. Please check your browser settings.");
                    } else if (event.error === 'network') {
                        alert("Network error. Voice dictation is a cloud service and requires an active internet connection.");
                    } else if (event.error === 'no-speech') {
                        console.log("No speech detected.");
                    } else {
                        alert("Speech Recog Error: " + event.error);
                    }
                    isRecording = false;
                    stopAnimation();
                };

                recognition.onend = function () {
                    console.log("Dictation ended");
                    isRecording = false;
                    stopAnimation();
                };

                recognition.start();

            } catch (e) {
                console.error("Recognition Start Error:", e);
                alert("Error starting dictation: " + e.message);
            }
        }

            if (currentFieldId) {
                const btn = document.getElementById(`mic-${currentFieldId}`);
                if (btn) btn.classList.remove('mic-active');
                currentFieldId = null;
            }
        }

                const kernelY = [

                ];

                            idx = (y * w + x) * 4;

                            outputData[idx + 2] = 255; // B
                            outputData[idx + 3] = brightness;
                        } else {
                            // Background -> Transparent (let CSS bg show) or Dark Blue
                            // Let's make it fully transparent so we can use CSS background
                            outputData[idx] = 0;
                            outputData[idx + 1] = 0;
                            outputData[idx + 2] = 0;
                            outputData[idx + 3] = 0;
                        }
                    }
                }

                // Fill canvas with Blueprint BG first
                ctx.fillStyle = '#001e28'; // Deep Blueprint Blue
                ctx.fillRect(0, 0, w, h);

                // Draw Grid
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                const gridSize = 40;

                // Grid Lines
                ctx.beginPath();
                for (let x = 0; x <= w; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
                for (let y = 0; y <= h; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
                ctx.stroke();

                // Draw Circles (Schematic look) 
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
                ctx.beginPath();
                ctx.arc(w / 2, h / 2, w * 0.3, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(w / 2, h / 2, w * 0.4, 0, Math.PI * 2);
                ctx.stroke();

                // Draw Edges on top 
                // We need to put ImageData onto a temp canvas to draw it with composition if needed, 
                // or just put it directly. putImageData ignores context state (like alpha), so it replaces pixels. 
                // We want to overlay edges on the background. 
                const edgeCanvas = document.createElement('canvas');
                edgeCanvas.width = w;
                edgeCanvas.height = h;
                edgeCanvas.getContext('2d').putImageData(output, 0, 0);
                ctx.drawImage(edgeCanvas, 0, 0);

                // Add Technical Text 
                ctx.font = '12px monospace';
                ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.fillText('NEURO-SCHEMATIC v2.0', 10, 20);
                ctx.fillText(`ID: ${Date.now().toString().slice(-6)}`, 10, 35);

                // Crosshairs
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.moveTo(w / 2 - 20, h / 2);
                ctx.lineTo(w / 2 + 20, h / 2);
                ctx.moveTo(w / 2, h / 2 - 20);
                ctx.lineTo(w / 2, h / 2 + 20);
                ctx.stroke();
            };
        };

        // Hologram / Tilt Effect 
        window.initHologramEffect = function (containerId, canvasId) {
            const container = document.getElementById(containerId);
            const canvas = document.getElementById(canvasId);
            if (!container || !canvas) return;

            // Set initial container styles for 3D 
            container.style.perspective = "1000px";
            canvas.style.transition = "transform 0.1s ease-out";
            canvas.style.transformStyle = "preserve-3d";
            // Add a shadow that will move 
            canvas.style.boxShadow = "0 20px 50px rgba(0,0,0,0.5)";
            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Calculate rotation: center is 0 deg
                // Range: -15deg to +15deg
                const xPct = x / rect.width; // 0 to 1
                const yPct = y / rect.height; // 0 to 1

                const rotateY = (xPct - 0.5) * 30; // -15 to +15
                const rotateX = (0.5 - yPct) * 30; // +15 to -15 (inverted Y)

                canvas.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.1)
            translateZ(50px)`;

                // Dynamic shadow
                const shadowX = (0.5 - xPct) * 30;
                const shadowY = (0.5 - yPct) * 30;
                canvas.style.boxShadow = `${shadowX}px ${shadowY + 20}px 30px rgba(0, 255, 255, 0.2)`;
            });

            container.addEventListener('mouseleave', () => {
                canvas.style.transform = "rotateX(0deg) rotateY(0deg) scale(1) translateZ(0px)";
                canvas.style.boxShadow = "0 0 0 rgba(0,0,0,0)";
            });
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', init);
        // --- MINI GAME: SYNAPSE SNAKE ---
        window.launchNeuroGame = function () {
            // Create Overlay with Radial Gradient
            const overlay = document.createElement('div');
            overlay.id = 'neuro-game-overlay';
            overlay.style.cssText = `
                position: fixed; inset: 0; 
                background: #000000;
                z-index: 99999;
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                animation: fadeIn 0.2s ease-out; font-family: 'JetBrains Mono', monospace;
            `;

            overlay.innerHTML = `
                <div style="position: absolute; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 5;"></div>
                
                <div style="position: absolute; top: 40px; left: 40px; display: flex; align-items: center; gap: 15px; z-index: 10;">
                    <div style="border: 1px solid #333; background: #050505; padding: 10px 20px; display: flex; align-items: center; gap: 10px; box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);">
                         <div style="width: 8px; height: 8px; background: #00ff41; box-shadow: 0 0 5px #00ff41;"></div>
                         <span style="color: #00ff41; font-weight: 800; font-size: 1.2rem; letter-spacing: 2px; text-shadow: 0 0 5px rgba(0,255,65,0.5);">SYNAPSE.EXE</span>
                         <span style="font-size: 0.7rem; color: #333; background: #00ff41; padding: 2px 4px; font-weight:bold; margin-left:10px;">V3.0</span>
                    </div>
                </div>
                
                <div style="position: absolute; top: 40px; right: 40px; z-index: 10;">
                    <button onclick="closeNeuroGame()" style="
                        background: #050505; 
                        border: 1px solid #333; 
                        color: #666; 
                        padding: 10px 25px; 
                        cursor: pointer; 
                        font-family: inherit;
                        font-weight: 600;
                        letter-spacing: 1px;
                        transition: all 0.2s;
                        text-transform: uppercase;
                    " onmouseover="this.style.borderColor='#f00'; this.style.color='#f00'; this.style.boxShadow='0 0 10px rgba(255,0,0,0.3)'" onmouseout="this.style.borderColor='#333'; this.style.color='#666'; this.style.boxShadow='none'">[ TERMINATE ]</button>
                </div>
                
                <div style="position: relative; z-index: 10;">
                    <!-- Canvas Frame -->
                    <div style="border: 1px solid #333; padding: 4px; background: #111; box-shadow: 0 0 30px rgba(0,0,0,0.8);">
                        <canvas id="game-canvas" width="600" height="600" style="
                            background: #050505; 
                            display: block;
                            border: 1px solid #222;
                        "></canvas>
                    </div>
                    
                    <!-- HUD Score -->
                    <div style="position: absolute; top: 20px; left: 20px; pointer-events: none;">
                        <span style="color: #444; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; display: block; margin-bottom: 2px;">AXON_LENGTH</span>
                        <div id="game-score" style="color: #00ff41; font-size: 2.5rem; font-weight: 800; line-height: 1; text-shadow: 0 0 10px rgba(0, 255, 65, 0.5); font-family: 'Courier New', monospace;">0</div>
                    </div>
                    
                    <!-- Menu Overlay -->
                    <div id="game-menu" style="position: absolute; inset: 5px; background: rgba(5, 5, 5, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; border: 1px solid #222;">
                        <h1 style="color: white; font-size: 3.5rem; font-weight: 900; margin: 0 0 1rem 0; letter-spacing: 4px; text-shadow: 2px 2px 0px #00ff41;">SYNAPSE</h1>
                        
                        <div style="display:flex; gap: 2rem; margin-bottom: 3rem;">
                            <div style="text-align:center;">
                                <div style="color: #666; font-size: 0.8rem; margin-bottom:5px;">STATUS</div>
                                <div style="color: #00ff41;">ONLINE</div>
                            </div>
                            <div style="text-align:center;">
                                <div style="color: #666; font-size: 0.8rem; margin-bottom:5px;">SYSTEM</div>
                                <div style="color: #00ff41;">READY</div>
                            </div>
                        </div>
                        
                        <button id="start-btn" style="
                            background: #00ff41; 
                            color: #000; 
                            border: none; 
                            padding: 1.2rem 4rem; 
                            font-size: 1.2rem; 
                            font-weight: 900; 
                            cursor: pointer; 
                            letter-spacing: 2px;
                            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
                            transition: all 0.1s;
                            font-family: 'JetBrains Mono', monospace;
                        " onmouseover="this.style.background='#fff'; this.style.boxShadow='0 0 20px white'" onmouseout="this.style.background='#00ff41'; this.style.boxShadow='none'">INITIALIZE</button>
                    </div>
                </div>
            `;

            document.body.appendChild(overlay);

            // Close Handler
            window.closeNeuroGame = () => {
                if (window.gameLoopId) cancelAnimationFrame(window.gameLoopId);
                overlay.remove();
            };

            // Game Logic
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            const scoreEl = document.getElementById('game-score');
            const menu = document.getElementById('game-menu');
            const startBtn = document.getElementById('start-btn');

            // Config
            const gridSize = 20;
            const tileCount = canvas.width / gridSize;
            let speed = 7;

            // State
            let headX = 10;
            let headY = 10;
            let velocityX = 0;
            let velocityY = 0;
            let trail = [];
            let tail = 5;
            let foodX = 15;
            let foodY = 15;
            let score = 0;
            let isPaused = true;
            let lastRenderTime = 0;
            let frame = 0; // For animations

            // Input
            document.addEventListener('keydown', keyDownEvent);

            function keyDownEvent(e) {
                // Prevent scrolling with arrows
                if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
                    e.preventDefault();
                }

                if (isPaused) return;
                switch (e.keyCode) {
                    case 37: if (velocityX !== 1) { velocityX = -1; velocityY = 0; } break; // Left
                    case 65: if (velocityX !== 1) { velocityX = -1; velocityY = 0; } break; // A

                    case 38: if (velocityY !== 1) { velocityX = 0; velocityY = -1; } break; // Up
                    case 87: if (velocityY !== 1) { velocityX = 0; velocityY = -1; } break; // W

                    case 39: if (velocityX !== -1) { velocityX = 1; velocityY = 0; } break; // Right
                    case 68: if (velocityX !== -1) { velocityX = 1; velocityY = 0; } break; // D

                    case 40: if (velocityY !== -1) { velocityX = 0; velocityY = 1; } break; // Down
                    case 83: if (velocityY !== -1) { velocityX = 0; velocityY = 1; } break; // S
                }
            }

            // Loop
            function drawGame(currentTime) {
                if (!document.getElementById('neuro-game-overlay')) return; // Exit if closed
                window.gameLoopId = requestAnimationFrame(drawGame);

                frame++;
                const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
                if (secondsSinceLastRender < 1 / speed) return;
                lastRenderTime = currentTime;

                if (isPaused) return;

                update();
                render();
            }

            function update() {
                headX += velocityX;
                headY += velocityY;

                // Wrap around (Toroidal Brain Topology!)
                if (headX < 0) headX = tileCount - 1;
                if (headX > tileCount - 1) headX = 0;
                if (headY < 0) headY = tileCount - 1;
                if (headY > tileCount - 1) headY = 0;

                // Check Food
                if (headX === foodX && headY === foodY) {
                    tail++;
                    score += 10;
                    scoreEl.innerText = score;
                    speed = Math.min(speed + 0.2, 25); // Cap speed
                    // Respawn food
                    let newX, newY;
                    do {
                        newX = Math.floor(Math.random() * tileCount);
                        newY = Math.floor(Math.random() * tileCount);
                    } while (trail.some(t => t.x === newX && t.y === newY));

                    foodX = newX;
                    foodY = newY;

                    // FX
                    triggerConfetti(foodX * gridSize, foodY * gridSize);
                }

                // Move Trail
                trail.push({ x: headX, y: headY });
                while (trail.length > tail) {
                    trail.shift();
                }

                // Check Collision (Self)
                for (let i = 0; i < trail.length - 1; i++) {
                    if (trail[i].x === headX && trail[i].y === headY) {
                        gameOver();
                    }
                }
            }

            function render() {
                // Clear
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Grid (Tech Style)
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 0; i < tileCount; i++) {
                    ctx.moveTo(i * gridSize, 0);
                    ctx.lineTo(i * gridSize, canvas.height);
                    ctx.moveTo(0, i * gridSize);
                    ctx.lineTo(canvas.width, i * gridSize);
                }
                ctx.stroke();

                // Snake (Axon) - Cyber Style
                for (let i = 0; i < trail.length; i++) {
                    const isHead = i === trail.length - 1;

                    if (isHead) {
                        ctx.fillStyle = '#fff';
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#00ff41'; // Neon Green Glow
                    } else {
                        const pct = i / trail.length;
                        ctx.fillStyle = `rgba(0, 255, 65, ${0.4 + (pct * 0.6)})`;
                        ctx.shadowBlur = 0;
                    }

                    // Sharp Rectangles for tech look
                    ctx.fillRect(trail[i].x * gridSize, trail[i].y * gridSize, gridSize - 1, gridSize - 1);
                }

                // Food - Glitchy Cube
                ctx.fillStyle = '#ff003c'; // Cyber Red
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff003c';

                const fx = foodX * gridSize;
                const fy = foodY * gridSize;

                // Draw diamond shape
                ctx.beginPath();
                ctx.moveTo(fx + gridSize / 2, fy + 2);
                ctx.lineTo(fx + gridSize - 2, fy + gridSize / 2);
                ctx.lineTo(fx + gridSize / 2, fy + gridSize - 2);
                ctx.lineTo(fx + 2, fy + gridSize / 2);
                ctx.fill();

                ctx.shadowBlur = 0;
            }




            function triggerConfetti(x, y) {
                // Cyber Green Flash
                const flash = document.createElement('div');
                flash.style.cssText = `
                    position: absolute; inset: 0; background: rgba(0, 255, 65, 0.1); pointer-events: none;
                    animation: fadeOut 0.2s linear forwards;
                `;
                overlay.appendChild(flash);
                setTimeout(() => flash.remove(), 200);
            }

            function gameOver() {
                isPaused = true;
                menu.style.display = 'flex';
                menu.innerHTML = `
                    <h1 style="color: #ff003c; font-size: 3rem; font-weight: 900; margin: 0 0 0.5rem 0; letter-spacing: 2px; text-shadow: 0 0 10px red;">FATAL ERROR</h1>
                    <div style="font-family: 'Courier New'; color: #666; margin-bottom: 2rem;">CONNECTION_LOST</div>
                    
                    <div style="display:flex; flex-direction:column; align-items:center; margin-bottom: 2rem; border: 1px solid #333; padding: 1rem 3rem; background: #000;">
                        <span style="color: #666; font-size: 0.8rem; text-transform: uppercase;">DATA_PACKETS</span>
                        <span style="color: white; font-size: 3rem; font-weight: 800; line-height: 1; text-shadow: 0 0 10px white;">${score}</span>
                    </div>
                    
                    <button onclick="resetGame()" style="
                        background: #333; 
                        color: white; 
                        border: 1px solid #444; 
                        padding: 1rem 3rem; 
                        font-size: 1.1rem; 
                        font-weight: 600; 
                        cursor: pointer;
                        font-family: inherit;
                        text-transform: uppercase;
                    " onmouseover="this.style.background='#444'" onmouseout="this.style.background='#333'">REBOOT_SYSTEM</button>
                    
                    <button onclick="closeNeuroGame()" style="background: none; color: #444; border: none; padding: 1rem; margin-top: 0.5rem; cursor: pointer; font-size: 0.8rem; text-decoration: underline;">ABORT</button>
                `;
            }

            // Expose reset for the button
            window.resetGame = () => {
                headX = 10;
                headY = 10;
                velocityX = 1; // Auto start moving right
                velocityY = 0;
                trail = [];
                tail = 5;
                score = 0;
                speed = 7;
                scoreEl.innerText = 0;
                menu.style.display = 'none';
                isPaused = false;
            };

            startBtn.onclick = () => {
                resetGame();
                window.gameLoopId = requestAnimationFrame(drawGame);
            };
        };

        // --- END MINI GAME ---
    </script>
</body>
